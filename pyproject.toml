[project]
name = "healthcare-diagnostic-loop"
version = "0.1.0"
description = "Autonomous Digital Workforce applied to Healthcare Domain via Agentic Loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-ai>=0.0.1",
    "langgraph>=0.1.0",
    "chromadb>=0.4.0",
    "streamlit>=1.39.0",
    "python-dotenv>=1.0.0",
    "groq>=0.9.0",
    "rich>=13.0.0",
    "assemblyai>=0.35.0",
    "gTTS>=2.5.2",
]

[project.optional-dependencies]
# Enables best-effort local autoplay of synthesized reports in voice_output_node.
# Omit this group in headless/server deployments with no audio device.
voice-playback = ["playsound==1.2.2"]
